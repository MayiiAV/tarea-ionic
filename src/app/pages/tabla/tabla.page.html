<ion-header>
  <ion-toolbar>
    <ion-title>Tabla de Multiplicar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-input
      label="Ingrese un número"
      labelPlacement="stacked"
      type="number"
      [(ngModel)]="numero">
    </ion-input>
  </ion-item>

  <ion-button expand="block" (click)="mostrarTabla()">
    Mostrar Tabla
  </ion-button>

  <ion-list>

    <ion-item *ngFor="let resultado of resultados">
      {{ resultado }}
    </ion-item>

  </ion-list>

</ion-content>
