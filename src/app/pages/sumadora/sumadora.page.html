<ion-header>
  <ion-toolbar>
    <ion-title>Sumadora</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-input
      label="Número 1"
      labelPlacement="stacked"
      type="number"
      [(ngModel)]="numero1">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Número 2"
      labelPlacement="stacked"
      type="number"
      [(ngModel)]="numero2">
    </ion-input>
  </ion-item>

  <ion-button expand="block" (click)="sumar()">
    Sumar
  </ion-button>

  <h2>Resultado: {{ resultado }}</h2>

</ion-content>
